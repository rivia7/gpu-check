# gpu-check 中转站：提供 /gpu/ 下的静态文件（由 sync 容器写入 /data），其余路径一律 404。
# /h100/ 是改名前（项目原名 h100-check）的旧路径，内容与 /gpu/ 相同，保留给已有的一键命令。
server {
    listen 80;
    server_name _;
    server_tokens off;
    charset utf-8;

    location = /gpu {
        return 301 /gpu/;
    }
    location = /h100 {
        return 301 /h100/;
    }

    location /gpu/ {
        alias /data/;
        index index.txt;
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        limit_except GET {
            deny all;
        }
    }

    location /h100/ {
        alias /data/;
        index index.txt;
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        limit_except GET {
            deny all;
        }
    }

    # 同步时写的临时文件、隐藏文件不对外
    location ~ /\. {
        return 404;
    }
    location ~ \.tmp(\.\d+)?$ {
        return 404;
    }

    location / {
        return 404;
    }
}
