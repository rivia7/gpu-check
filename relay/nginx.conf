# h100-check 中转站：只提供 /h100/ 下的静态文件（由 sync 容器写入 /data），其余路径一律 404
server {
    listen 80;
    server_name _;
    server_tokens off;
    charset utf-8;

    location = /h100 {
        return 301 /h100/;
    }

    location /h100/ {
        alias /data/;
        index index.txt;
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        limit_except GET {
            deny all;
        }
    }

    # 同步时写的临时文件、隐藏文件不对外
    location ~ /\. {
        return 404;
    }
    location ~ \.tmp(\.\d+)?$ {
        return 404;
    }

    location / {
        return 404;
    }
}
